format = """░▒$directory▒$git_branch$git_status▓$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala▓$docker_context▓$cmd_duration▒░"""

add_newline = false
palette = "gruvbox_light"

[palettes.gruvbox_light]
bg0 = "#fbf1c7"
bg1 = "#ebdbb2"
bg2 = "#d5c4a1"
fg0 = "#3c3836"
gray = "#928374"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
purple = "#b16286"
aqua = "#689d6a"
orange = "#d65d0e"

[directory]
style = "bold bg:bg1 fg:blue"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bold bg:red fg:bg0"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bold bg:blue fg:bg0"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bold bg:bg1 fg:aqua"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bold bg:purple fg:bg0"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bold bg:aqua fg:fg0"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bold bg:blue fg:bg0"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold bg:yellow fg:fg0"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bold bg:blue fg:bg0"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bold bg:orange fg:fg0"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bold bg:purple fg:bg0"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bold bg:red fg:bg0"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bold bg:purple fg:bg0"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bold bg:green fg:fg0"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bold bg:yellow fg:fg0"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bold bg:orange fg:fg0"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bold bg:red fg:bg0"
format = '[ $symbol ($version) ]($style)'

[cmd_duration]
min_time = 0
show_milliseconds = true
disabled = false
style = "bold bg:bg2 fg:fg0"
format = '[ ⏱ $duration]($style)'
