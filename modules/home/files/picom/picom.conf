# Match Hyprland's application opacity and decoration on XLibre.
backend = "glx";
vsync = true;
# Repaint newly mapped ARGB windows even when the driver misses damage events.
use-damage = false;
no-frame-pacing = true;
fading = false;
use-ewmh-active-win = true;
detect-client-opacity = true;
# Wait for GL/ARGB clients to finish drawing before sampling their new pixmap.
xrender-sync-fence = true;
blur-method = "dual_kawase";
blur-strength = 4;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-color = "#3c3836";
corner-radius = 8;

# Last matching rule wins. Fullscreen uses Hyprland's focused opacity.
rules = (
  {
    match = "class_g = 'com.mitchellh.ghostty' || class_g = 'Ghostty' || class_g = 'Thunar' || class_g = 'md.obsidian.Obsidian' || class_g = 'obsidian' || class_g = 'Obsidian' || class_g = 'dev.zed.Zed' || class_g = 'zeditor' || class_g = 'Zed' || class_g = 'Emacs' || class_g = 'emacs' || class_g = 'vicinae' || class_g = 'Vicinae' || class_g = 'com.ayugram.desktop' || class_g = 'AyuGram'";
    opacity = 0.85;
    blur-background = true;
  },
  {
    match = "!focused && !fullscreen && (class_g = 'com.mitchellh.ghostty' || class_g = 'Ghostty' || class_g = 'Thunar' || class_g = 'md.obsidian.Obsidian' || class_g = 'obsidian' || class_g = 'Obsidian' || class_g = 'dev.zed.Zed' || class_g = 'zeditor' || class_g = 'Zed' || class_g = 'Emacs' || class_g = 'emacs' || class_g = 'vicinae' || class_g = 'Vicinae' || class_g = 'com.ayugram.desktop' || class_g = 'AyuGram')";
    opacity = 0.77;
  },
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'XSecurelock' || class_g = 'xsecurelock'";
    opacity = 1.0;
    blur-background = false;
    corner-radius = 0;
    shadow = false;
  }
);
