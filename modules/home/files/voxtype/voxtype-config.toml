state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
pause_media = true

[whisper]
# Multilingual model: dictation works with both Russian and English.
model = "large-v3-turbo"
language = "auto"
flash_attention = true

[output]
# Paste Unicode text atomically instead of emulating each character/keymap.
mode = "paste"
paste_keys = "shift+insert"
restore_clipboard = true
restore_clipboard_delay_ms = 300
fallback_to_clipboard = true

[output.notification]
on_recording_start = true
on_recording_stop = true

[osd]
# The packaged Voxtype does not include a working OSD frontend.
enabled = false
